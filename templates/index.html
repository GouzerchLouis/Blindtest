<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Blind Test Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="background-glow"></div>

    <aside class="sidebar">
        <h2>⚙️ Paramètres</h2>

        <div class="setting-group">
            <label for="time-n">Temps de réflexion (sec) :</label>
            <input type="number" id="time-n" min="5" max="60" value="15" class="styled-input">
        </div>

        <div class="setting-group">
            <label for="auto-next-toggle" class="checkbox-label">
                <input type="checkbox" id="auto-next-toggle" checked>
                <span class="custom-checkbox"></span>
                Passage auto.
            </label>
        </div>

        <div class="setting-group">
            <label for="time-m">Délai avant la suite (sec) :</label>
            <input type="number" id="time-m" min="1" max="20" value="5" class="styled-input">
        </div>
    </aside>

    <div class="container">
        <h1><span>🎵</span> BLIND TEST</h1>

        <div id="game">
            <div class="status-box">
                <p id="status">Appuie sur jouer pour commencer</p>
            </div>

            <div class="answer-box">
                <p id="answer" style="display: none;"></p>
            </div>

            <div class="button-group">
                <button id="next-btn" class="btn-secondary">Musique suivante</button>
                <button onclick="showAnswer()" class="btn-accent">Voir la réponse</button>
            </div>
        </div>
    </div>

    <div id="player"></div>

    <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script defer src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
